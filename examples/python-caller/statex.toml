# statex app manifest
[app]
name = "pycaller"

# Hosts the http-client interface may call: "api.example.com", "*.example.com" or "*".
[http]
allow = []

[limits]
timeout_ms = 5000
memory_mb = 64

# Python actors are compiled to a WebAssembly component with componentize-py
# (pip install componentize-py==0.25.1, or let uvx fetch it).
[build]
command = "uvx --python 3.12 --from componentize-py==0.25.1 componentize-py -d wit -w app componentize app -o app.wasm"
wasm = "app.wasm"

# Apps whose actors this app calls; `statex calls sync` generates their client
# interfaces into wit/deps/.
[calls]
apps = ["counter", "pycaller"]
# Where to read callee source outside a workspace.
paths = { counter = "../counter" }
