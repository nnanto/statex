# statex app manifest
[app]
name = "demo/rustdemo"

# Hosts the http-client interface may call: "api.example.com", "*.example.com" or "*".
[http]
allow = []

[limits]
timeout_ms = 5000
memory_mb = 64

[calls]
# Apps whose actors this app calls; `statex calls sync` generates their clients.
apps = ["demo/db"]
