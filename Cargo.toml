[workspace]
resolver = "2"
members = ["crates/store", "crates/ltx", "crates/runtime", "crates/node", "crates/cli", "crates/guest"]
exclude = ["examples", "apps"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
crc32fast = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
wasmtime = { version = "49", default-features = false, features = ["component-model", "cranelift", "runtime", "cache", "parallel-compilation", "pooling-allocator", "anyhow"] }
wasmtime-wasi = "49"
wit-parser = "0.261"
wit-component = "0.261"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = "2"
quick-xml = "0.37"
httpdate = "1"
urlencoding = "2"
tempfile = "3"
toml = "0.8"
statex-store = { path = "crates/store" }
statex-ltx = { path = "crates/ltx" }
statex-runtime = { path = "crates/runtime" }
statex-node = { path = "crates/node" }
